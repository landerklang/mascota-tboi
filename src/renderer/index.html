<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app-container">
      <div id="pet">
        <img src="imagenes/gif.gif" alt="azal" draggable="false" id="pet-img" />
      </div>

      <!-- La Hub -->
      <div id="hub" class="hidden">
        <button id="btn-close" title="Cerrar aplicación">✖</button>
      </div>

      <!-- El cuadro de selección al estilo Paint -->
      <div id="selection-box" class="hidden">
        <div class="handle top-left" data-dir="tl"></div>
        <div class="handle top-right" data-dir="tr"></div>
        <div class="handle bottom-left" data-dir="bl"></div>
        <div class="handle bottom-right" data-dir="br"></div>
      </div>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
